name:    yesod-hash-hs
version: "0.1.0"

dependencies:
- base
- yesod-core
- text
- bytestring
- cryptonite
- memory

library:
  source-dirs: src

executables:
  yesod-hash-hs:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - yesod-hash-hs
